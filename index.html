<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="抓大鹅渲染图统计清单 · 2026" />
  <title>抓大鹅渲染图统计清单</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <p class="eyebrow">KUNPO · 抓大鹅</p>
      <h1 id="title">抓大鹅渲染图统计清单</h1>
      <p class="sub" id="year-label">2026 年度渲染进度</p>
    </header>

    <section class="summary" aria-label="年度汇总">
      <div class="stat-grid">
        <article class="stat-card">
          <span class="stat-label">月度条目</span>
          <strong class="stat-value" id="monthly-items">—</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">有内容月份</span>
          <strong class="stat-value"><span id="months-with-content">—</span><span class="muted">/12</span></strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">月度外条目</span>
          <strong class="stat-value" id="outside-items">—</strong>
        </article>
      </div>
      <div class="progress-block">
        <div class="progress-meta">
          <span>进度（有内容月份）</span>
          <span id="progress-text">—</span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </section>

    <section class="focus" aria-label="当月焦点">
      <div class="section-head">
        <h2>当月焦点</h2>
        <span class="badge" id="current-month-badge">—</span>
      </div>
      <div class="chips" id="current-chips"></div>
    </section>

    <section class="overview" aria-label="月份总览">
      <div class="section-head">
        <h2>月份总览</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>月份</th>
              <th>文件夹</th>
              <th>数量</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="month-table"></tbody>
        </table>
      </div>
    </section>

    <section class="months" aria-label="各月明细">
      <div class="section-head">
        <h2>各月明细</h2>
        <button type="button" class="ghost-btn" id="toggle-all">全部展开</button>
      </div>
      <div class="month-list" id="month-list"></div>
    </section>

    <section class="outside" aria-label="月度外">
      <div class="section-head">
        <h2>月度外</h2>
        <span class="badge soft" id="outside-badge">—</span>
      </div>
      <div class="outside-list" id="outside-list"></div>
    </section>

    <footer class="footer">
      <p>数据来源：本地 Output/<span id="footer-year">2026</span> 扫描结果（不托管 PNG）</p>
      <p>生成时间：<time id="generated-at">—</time></p>
      <p class="muted small">keepline/goose-render-index</p>
    </footer>

    <div class="error hidden" id="error" role="alert"></div>
  </div>
  <script src="./js/app.js"></script>
</body>
</html>
